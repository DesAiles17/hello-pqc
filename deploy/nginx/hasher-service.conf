server {
    listen 3443 ssl;
    server_name hasher-service-tls;
    resolver 127.0.0.11 ipv6=off valid=30s;

    ssl_certificate /etc/nginx/tls/hasher-service-tls.crt;
    ssl_certificate_key /etc/nginx/tls/hasher-service-tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        set $hasher_upstream http://hasher-service:3001;
        proxy_pass $hasher_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
