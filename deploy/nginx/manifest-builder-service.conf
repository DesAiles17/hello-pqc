server {
    listen 3443 ssl;
    server_name manifest-builder-service-tls;

    ssl_certificate /etc/nginx/tls/manifest-builder-service-tls.crt;
    ssl_certificate_key /etc/nginx/tls/manifest-builder-service-tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://manifest-builder-service:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
