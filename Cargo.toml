[package]
name = "hello-pqc"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["rt-multi-thread", "macros"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.20"

# чисті PQClean-біндинги
pqcrypto-mldsa = "0.1.2"  # ML-DSA-44/65/87
pqcrypto-falcon = "0.4.1" # Falcon-512/1024

#OQS (liboqs) — безпечно-стильний API
oqs = "0.11.0"
crypto = "0.5.1"
