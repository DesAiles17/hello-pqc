x-pqc-service: &pqc-service
  image: pqc-services:dev
  # SECURITY: Run as non-root, limit capabilities
  user: "1000:1000"
  cap_drop: [ "ALL" ]
  cap_add: [ "NET_BIND_SERVICE" ]
  security_opt: [ "no-new-privileges:true" ]
  networks: [ "pqc-network" ]

services:
  pqc-build:
    # A “builder-only” service so `docker compose build` builds one image.
    # You don't run this container.
    profiles: [ "build" ]
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: pqc-services:dev
    command: [ "true" ]
    environment:
      REQUIRE_AUTH: "true"

  api-gateway:
    <<: *pqc-service
    container_name: pqc-api-gateway
    ports: [ "3000:3000" ]
    environment:
      PORT: 3000
      ENVIRONMENT: ${ENVIRONMENT:-local}
      HASHER_SERVICE_URL: ${HASHER_SERVICE_URL:-https://hasher-service-tls:3443}
      MANIFEST_SERVICE_URL: ${MANIFEST_SERVICE_URL:-https://manifest-builder-service-tls:3443}
      ALLOW_INSECURE_INTERNAL_HTTP: ${ALLOW_INSECURE_INTERNAL_HTTP:-false}
      INTERNAL_CA_CERT_PATH: /app/tls/ca-bundle.crt
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
      RATE_LIMIT_SIGN_PER_MIN: ${RATE_LIMIT_SIGN_PER_MIN:-60}
      RATE_LIMIT_VERIFY_PER_MIN: ${RATE_LIMIT_VERIFY_PER_MIN:-120}
      RATE_LIMIT_HASH_PER_MIN: ${RATE_LIMIT_HASH_PER_MIN:-100}
      RATE_LIMIT_GLOBAL_PER_MIN: ${RATE_LIMIT_GLOBAL_PER_MIN:-200}
      RATE_LIMIT_AUTH_FAIL_PER_MIN: ${RATE_LIMIT_AUTH_FAIL_PER_MIN:-60}
      MAX_CONCURRENT_VERIFY: ${MAX_CONCURRENT_VERIFY:-4}
      MAX_JSON_BODY_SIZE: ${MAX_JSON_BODY_SIZE:-65536}
      MAX_UPLOAD_STORAGE_PER_KEY: ${MAX_UPLOAD_STORAGE_PER_KEY:-536870912}
      UPLOAD_RETENTION_HOURS: ${UPLOAD_RETENTION_HOURS:-24}
      RUST_LOG: info
      SIGNATURE_PROFILE: hybrid
      MANIFEST_DOMAIN_SEP: pqc-hons.manifest.v1
      MANIFEST_SCHEMA_VERSION: pqc-hons.manifest.v1
      HASH_ALGORITHM: SHA256
      MINIO_BUCKET: pqc-objects
      REQUIRE_AUTH: ${REQUIRE_AUTH:-true}
      DATABASE_URL: ${DATABASE_URL:-postgres://pqc:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-pqc}}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?Set INTERNAL_SERVICE_TOKEN}
      API_KEYS_FILE: /app/api-keys.json
    command: ./api-gateway
    volumes:
      - ./api-keys.local.json:/app/api-keys.json:ro
      - ./tls:/app/tls:ro
      - upload-data:/data/uploads:rw
    depends_on:
      hasher-service-tls:
        condition: service_started
      manifest-builder-service-tls:
        condition: service_started
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  hasher-service:
    <<: *pqc-service
    container_name: pqc-hasher-service
    environment:
      PORT: 3001
      ENVIRONMENT: ${ENVIRONMENT:-local}
      RUST_LOG: info
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-https://minio:9000}
      AWS_CA_BUNDLE: /app/tls/ca-bundle.crt
      SSL_CERT_FILE: /app/tls/ca-bundle.crt
      MINIO_ACCESS_KEY: ${MINIO_HASHER_ACCESS_KEY:?Set MINIO_HASHER_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_HASHER_SECRET_KEY:?Set MINIO_HASHER_SECRET_KEY}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      MINIO_BUCKET: ${MINIO_BUCKET:-pqc-objects}
      ALLOW_INSECURE_MINIO_HTTP: ${ALLOW_INSECURE_MINIO_HTTP:-false}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?Set INTERNAL_SERVICE_TOKEN}
      ALLOWED_FILE_DIRECTORIES: /data/uploads
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-104857600}
      FOLLOW_SYMLINKS: ${FOLLOW_SYMLINKS:-false}
    command: ./hasher-service
    volumes:
      - ./tls:/app/tls:ro
      - upload-data:/data/uploads:rw
    depends_on:
      minio-init:
        condition: service_completed_successfully

  manifest-builder-service:
    <<: *pqc-service
    container_name: pqc-manifest-builder-service
    environment:
      PORT: 3002
      ENVIRONMENT: ${ENVIRONMENT:-local}
      RUST_LOG: info
      RSA_PRIVATE_KEY: /app/keys/rsa_private.pem
      RSA_PUBLIC_KEY: /app/keys/rsa_public.pem
      DILITHIUM_SECRET_KEY: /app/keys/dilithium_sk.bin
      DILITHIUM_PUBLIC_KEY: /app/keys/dilithium_pk.bin
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-https://minio:9000}
      AWS_CA_BUNDLE: /app/tls/ca-bundle.crt
      SSL_CERT_FILE: /app/tls/ca-bundle.crt
      MINIO_ACCESS_KEY: ${MINIO_VERIFIER_ACCESS_KEY:?Set MINIO_VERIFIER_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_VERIFIER_SECRET_KEY:?Set MINIO_VERIFIER_SECRET_KEY}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      ALLOW_INSECURE_MINIO_HTTP: ${ALLOW_INSECURE_MINIO_HTTP:-false}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?Set INTERNAL_SERVICE_TOKEN}
      MAX_MANIFEST_AGE_HOURS: ${MAX_MANIFEST_AGE_HOURS:-24}
      MAX_VERIFY_OBJECT_SIZE: ${MAX_VERIFY_OBJECT_SIZE:-104857600}
    command: ./manifest-builder-service
    volumes:
      - ./keys:/app/keys:ro
      - ./tls:/app/tls:ro
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  hasher-service-tls:
    image: nginx:alpine
    container_name: pqc-hasher-service-tls
    depends_on:
      hasher-service:
        condition: service_started
    volumes:
      - ./deploy/nginx/hasher-service.conf:/etc/nginx/conf.d/default.conf:ro
      - ./tls:/etc/nginx/tls:ro
    networks: [ "pqc-network" ]

  manifest-builder-service-tls:
    image: nginx:alpine
    container_name: pqc-manifest-builder-service-tls
    depends_on:
      manifest-builder-service:
        condition: service_started
    volumes:
      - ./deploy/nginx/manifest-builder-service.conf:/etc/nginx/conf.d/default.conf:ro
      - ./tls:/etc/nginx/tls:ro
    networks: [ "pqc-network" ]

  postgres:
    image: postgres:16
    container_name: pqc-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pqc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-pqc}
    ports: [ "127.0.0.1:5432:5432" ]
    volumes:
      - postgres-data:/var/lib/postgresql
    networks: [ "pqc-network" ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pqc} -d ${POSTGRES_DB:-pqc}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio:
    image: minio/minio:latest
    container_name: pqc-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001" --certs-dir /certs
    ports: [ "127.0.0.1:9000:9000", "127.0.0.1:9001:9001" ]
    volumes:
      - minio-data:/data
      - ./tls/minio:/certs:ro
    networks: [ "pqc-network" ]
    healthcheck:
      test: [ "CMD", "curl", "-kf", "https://localhost:9000/minio/health/live" ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  minio-init:
    image: minio/mc:latest
    container_name: pqc-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        mc alias set local https://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"

        mc mb --ignore-existing local/${MINIO_BUCKET:-pqc-objects}

        mc admin user add local "$MINIO_HASHER_ACCESS_KEY" "$MINIO_HASHER_SECRET_KEY" || true
        mc admin policy attach local readwrite --user "$MINIO_HASHER_ACCESS_KEY" || true

        mc admin user add local "$MINIO_VERIFIER_ACCESS_KEY" "$MINIO_VERIFIER_SECRET_KEY" || true
        mc admin policy attach local readonly --user "$MINIO_VERIFIER_ACCESS_KEY" || true

        echo "MinIO app users configured"
    environment:
      SSL_CERT_FILE: /tls/ca-bundle.crt
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-pqc-objects}
      MINIO_HASHER_ACCESS_KEY: ${MINIO_HASHER_ACCESS_KEY:?Set MINIO_HASHER_ACCESS_KEY}
      MINIO_HASHER_SECRET_KEY: ${MINIO_HASHER_SECRET_KEY:?Set MINIO_HASHER_SECRET_KEY}
      MINIO_VERIFIER_ACCESS_KEY: ${MINIO_VERIFIER_ACCESS_KEY:?Set MINIO_VERIFIER_ACCESS_KEY}
      MINIO_VERIFIER_SECRET_KEY: ${MINIO_VERIFIER_SECRET_KEY:?Set MINIO_VERIFIER_SECRET_KEY}
    volumes:
      - ./tls:/tls:ro
    networks: [ "pqc-network" ]
    restart: "no"

networks:
  pqc-network:
    driver: bridge

volumes:
  postgres-data:
  minio-data:
  upload-data:
